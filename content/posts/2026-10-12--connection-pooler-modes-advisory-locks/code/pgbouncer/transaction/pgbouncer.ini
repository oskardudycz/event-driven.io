[databases]
app            = host=postgres port=5432 dbname=app pool_size=1
app_other      = host=postgres port=5432 dbname=app pool_size=1
app_pair       = host=postgres port=5432 dbname=app pool_size=2
app_multiplex  = host=postgres port=5432 dbname=app pool_size=10
app_realistic  = host=postgres port=5432 dbname=app pool_size=20
app_processors = host=postgres port=5432 dbname=app pool_mode=session

[users]
processor = pool_mode=session

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6433
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = pgbouncer_admin
pool_mode = transaction
default_pool_size = 10
max_client_conn = 200
