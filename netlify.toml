[build]
	publish = "public/"
	command = "npm run import-and-build"

[build.environment]
NPM_VERSION = "11.9.0"

# Query-specific legacy category aliases precede the final error rewrites.
# Literal query values let Netlify decode both + and %20 correctly.

[[redirects]]
from = "/en/category/"
to = "/en/category/databases/"
status = 301
force = true
query = { category = "Databases" }

