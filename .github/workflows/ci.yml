name: Build and Deploy

on:
  # run it on push to the default repository branch
  push:
    branches: [main]
  # run it during pull request
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test-code:
    name: Build and test application code
    # use system defined below in the tests matrix
    runs-on: ${{ matrix.os }}

    strategy:
      # define the test matrix
      matrix:
        # selected operation systems to run CI
        os: [ubuntu-latest]
        # selected node version to run CI
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          # use the node version defined in matrix above
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - name: Compute Gatsby cache compatibility
        id: gatsby-cache-key
        run: node scripts/gatsby-cache-key.mjs
        env:
          GATSBY_DISQUS_NAME: ${{ secrets.GATSBY_DISQUS_NAME }}
          GOOGLE_TAG_ID: ${{ secrets.GOOGLE_TAG_ID }}
      - name: Restore Gatsby build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache
            public
          key: gatsby-${{ runner.os }}-${{ steps.gatsby-cache-key.outputs.compatibility }}-${{ github.sha }}
          restore-keys: |
            gatsby-${{ runner.os }}-${{ steps.gatsby-cache-key.outputs.compatibility }}-
      # install dependencies
      - run: yarn --frozen-lockfile
      - run: yarn smoke
      - run: yarn lint
      # build
      - run: yarn build
        env:
          GATSBY_DISQUS_NAME: ${{ secrets.GATSBY_DISQUS_NAME }}
          GOOGLE_TAG_ID: ${{ secrets.GOOGLE_TAG_ID }}
      - run: yarn test
      - name: Install Chromium for visual smoke tests
        run: yarn browsers:install:ci
      - name: Compare browser rendering with production snapshots
        run: |
          ./node_modules/.bin/gatsby serve -H 127.0.0.1 -p 9000 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS -o /dev/null http://127.0.0.1:9000/en/articles/; then
              break
            fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:9000/en/articles/
          yarn test:visual
      - name: Save validated Gatsby build cache
        uses: actions/cache/save@v6
        with:
          path: |
            .cache
            public
          key: gatsby-${{ runner.os }}-${{ steps.gatsby-cache-key.outputs.compatibility }}-${{ github.sha }}
      - name: Upload visual comparison screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-comparison
          path: visual-artifacts/
          if-no-files-found: ignore
      - name: Build & Deploy docs preview
        run: yarn deploy
        if: ${{ github.ref != 'refs/heads/main' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      # deploy
      - name: Build & Deploy docs
        run: yarn deploy:prod
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
